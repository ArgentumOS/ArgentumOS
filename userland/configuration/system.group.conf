<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
	<!-- FNX group identity (domain: system.group). -->
	<!---->
	<!-- Machine state, not defaults (System scope). One `group` record per -->
	<!-- group; `members` lists the member user names (comma list when -->
	<!-- non-empty; empty = no members). Consumed by musl getgr* (M3) and the -->
	<!-- account tools (M4). Grammar: docs/config-design.md section 10.1. -->
	<key>group</key>
	<dict>
		<key>Admin</key>
		<dict>
			<key>gid</key>
			<integer>0</integer>
			<key>members</key>
			<string></string>
		</dict>
	</dict>
</dict>
</plist>
