<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
	<!-- machine identity (system.network, System scope): init reads -->
	<!-- `hostname` at boot and sets the kernel nodename (sethostname), which -->
	<!-- feeds uname/gethostname and toybox `hostname` -->
	<!-- (docs/system-config-files-plan.md M5, §5.3). Future network -->
	<!-- settings (interfaces, DNS) belong in this domain too. -->
	<key>hostname</key>
	<string>fnx</string>
</dict>
</plist>
