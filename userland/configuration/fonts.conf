<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- FNX fonts.conf (FSH): the OS ships fonts under /System/Shared/Fonts,
     third parties under /Shared/Fonts, per-user under ~/Shared/Fonts
     (docs/design/fsh-proposal.md). Compiled into libfontconfig are no
     /usr paths: sysconfdir=/System/Configuration makes this file the
     default, and the <dir> list below replaces the stock defaults.
     <cachedir> rides /System/Variable Data (the FSH /var equivalent). -->
<fontconfig>
	<dir>/System/Shared/Fonts</dir>
	<dir>/Shared/Fonts</dir>
	<dir prefix="xdg">fonts</dir>

	<cachedir>/System/Variable Data/fontconfig</cachedir>

	<config>
		<rescan>
			<int>30</int>
		</rescan>
	</config>

	<match target="pattern">
		<edit name="dpi" mode="assign"><double>96</double></edit>
	</match>
	<match target="pattern">
		<edit name="antialias" mode="assign"><bool>true</bool></edit>
	</match>
</fontconfig>
