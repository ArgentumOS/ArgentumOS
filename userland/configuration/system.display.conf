# system.display.conf — FNX display physical size (domain: system.display;
# docs/design/argentum-uikit-plan.md §3 Units / S1.1).
#
# Argentum screen units are real points (1 pt = 1/72 in). The session
# converts points to pixels once at startup:
#
#   pxPerPt = PPI/72,  PPI = (x_ppi + y_ppi)/2,  ppi = px / (mm/25.4)
#
# Physical size source precedence (S1.1, user decision):
#   1. this domain: display.width_mm / display.height_mm (the FNX-owned
#      panel's real physical size). Both > 0 activate the override.
#   2. the display .conf domain file is absent in every scope (running
#      against a foreign X server) AND X11 DisplayWidthMM/HeightMM are
#      nonzero -> the X server's reported physical size.
#   3. fallback when the physical size is unknown: 96 dpi -> 4/3 px/pt.
#
# Xfb (the FNX X server) is NOT an authoritative source for physical mm:
# it derives mm from its own -dpi default (100) with no real panel
# behind it, so on FNX-owned machines the domain above is the source
# and an unset domain means "unknown" (96 dpi fallback), never Xfb's
# fabricated mm.
#
# 0 = unset (the shipped default). A System-scope copy wins over this
# Shared default (`config write -s system.display display.width_mm ...`),
# used by the S1.1/S1.4 unit-path gates to force a 2x px/pt.
#
# width/height/bpp are the framebuffer MODE the session runs in. init
# applies them through /dev/fb0 (IO_FB_SETMODE -> the kernel's Bochs-dispi
# mode-set) before it starts Xfb, because the firmware's own GOP mode is
# not settable from the QEMU command line: OVMF takes its mode from the
# EDID QEMU's VGA device generates, which prefers 1280x800 and whose
# standard-timing list has no 1920x1080. The kernel's mode-set has no such
# limit (VBE_DISPI_XRES/YRES; 1920x1080x32 needs 8.29MB of the device's
# 16MB VRAM).
#
# They ship ON at 1920x1080x32 (a 1080p desktop plus an application needs
# ~256MB of guest RAM; see QEMU_MEM in mk/00-base.mk). Setting all three to
# 0 keeps whatever the firmware left instead:
#
#   config write -s system.display display.width 0
#   config write -s system.display display.height 0
#   config write -s system.display display.bpp 0
# Nothing else has to know the resolution: the desktop's LAYOUT is a
# function of the SCREEN (the bar's width, the dock's edge and its work-area
# inset all come from it), and the pixel-driven gate drives read the
# geometry the WM logs rather than assuming a screen size. Only three keys
# have to be non-zero to switch anything, and a mode the controller rejects
# is logged and ignored.
#
# 1 pt stays 1 pt either way: the mode does not change how big things are,
# only how much desktop there is (a real 2x wants width_mm/height_mm
# above). Changing the mode under a live X server wipes the screen
# content, which is why init does it before the session starts.
display = {
    width_mm = 0.0
    height_mm = 0.0
    width = 1920
    height = 1080
    bpp = 32
}
