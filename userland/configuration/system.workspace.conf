# system.workspace.conf — the Workspace app's own settings (domain:
# system.workspace; docs/design/workspace-plan.md §3.0, decision D6).
#
# The desktop is split by kind, not by app: this app owns the wallpaper
# (the desktop surface) and the file manager. The window manager owns the
# dock and the menubar, and their keys live in system.kestrel.conf — the
# dock's were here until 2026-09 (decision D6).
#
# NOT settings yet — the keys this domain is specified to carry, none of
# which is read today:
#
#   wallpaper = <path>          the desktop surface (initial-release.md
#                               §3.2). Arrives with W0 of the plan, when
#                               Workspace paints it instead of Kestrel.
#   file-manager.start          home | root | volumes
#   file-manager.column-width   W6 of the plan.
