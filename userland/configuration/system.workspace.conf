# system.workspace.conf — the desktop's own settings (domain:
# system.workspace; docs/design/initial-release.md §3.1).
#
# S5.2c reads dock.position and dock.icon-size through
# Application::configString(), with libconfig's system -> user -> shared
# precedence (docs/config-design.md §5): a user-scope copy overrides these
# defaults. Both values here are the documented defaults, so a boot cannot
# tell the file from the code's fallback — changing one is the way to see
# it take effect.
#
# Not settings yet: dock.autohide and dock.magnify (§3.1) are animation
# behaviours and are deferred until the dock has them. The wallpaper path
# in §3.2 is likewise unimplemented (S5.2h: no image decoder yet).
dock = {
    position = "right"
    icon-size = 48
}
