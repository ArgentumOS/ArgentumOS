# system.argentum.conf — Argentum UIKit session defaults (domain:
# system.argentum; docs/design/argentum-uikit-plan.md, S0.5).
#
# Application::init() resolves these through libconfig (system ->
# user -> shared precedence, docs/config-design.md §5) and logs the
# effective values. The demo reads them back so a changed value is
# visible in the window: window.background is the demo's fill color and
# font.family/font.size drive drawText's default run.
#
# First-party defaults ship in /Shared/Configuration (overridable);
# `config write -s system.argentum <key> <value>` writes a System-scope
# copy that wins on read (used by the S0.5 acceptance).
window = {
    background = 0x2288ee
}
font = {
    family = "DejaVu Sans"
    size = 26
}
