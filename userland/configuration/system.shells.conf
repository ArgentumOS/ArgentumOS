<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
	<!-- Valid login shells (domain: system.shells). -->
	<!---->
	<!-- A plain list domain in System scope: the shells accounts may bind to -->
	<!-- (login policy, same tier as passwd). /System/Tools/sh is the only -->
	<!-- shell FNX ships today. Consumed by chsh/su (M4). Grammar: -->
	<!-- docs/config-design.md section 10. -->
	<key>shells</key>
	<string>/System/Tools/sh</string>
</dict>
</plist>
