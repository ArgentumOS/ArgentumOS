# system.theme.conf — the active Argentum theme (domain: system.theme;
# docs/design/argentum-uikit-plan.md §3 Themes / S1.3).
#
# The theme engine (argentum::Theme) resolves the active theme NAME from
# this domain (system -> user -> shared precedence, config-design.md §5)
# and loads the theme file itself from /Shared/Themes/<name>.conf — the
# plan puts themes in /Shared/Themes as plain .conf data files, outside
# the Configuration/ scope dirs, so the file is read with libconfig's
# raw-file read (config_read_file) rather than a domain read.
#
# First-party defaults ship in /Shared/Configuration (overridable);
# `config write -s system.theme active <name>` writes a System-scope
# copy that wins on read. An unknown name falls back to the shipped
# "Argentum" theme.
active = "Argentum"
