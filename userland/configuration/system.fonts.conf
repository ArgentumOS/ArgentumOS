# system.fonts.conf — FNX fontconfig configuration (libconfig domain)
#
# Fontconfig's default config (docs/design/fontconfig-config-plan.md):
# the domain loader (src/fclibconf.c) reads this file at FcInit time and
# drives the same internal builders fcxml.c uses, so public readers are
# unchanged. M0 keys: dirs / cachedir / rescan / accept / reject.
#
# dirs: FSH font locations. FNX ships OS fonts in /System/Shared/Fonts,
# third parties in /Shared/Fonts; per-user fonts under ~/Shared/Fonts
# follow the FSH convention (see fsh-proposal.md). FNX dirs are absolute
# FSH paths — the stock XML's relative/xdg prefix machinery is not
# meaningful here (§4 conventions).
dirs = [ "/System/Shared/Fonts", "/Shared/Fonts" ]
cachedir = "/System/Variable Data/fontconfig"
rescan = 30
