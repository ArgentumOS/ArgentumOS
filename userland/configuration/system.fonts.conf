<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
	<!-- system.fonts.conf — FNX fontconfig configuration (libconfig domain) -->
	<!---->
	<!-- Fontconfig's default config (docs/design/fontconfig-config-plan.md): -->
	<!-- the domain loader (src/fclibconf.c) reads this file at FcInit time and -->
	<!-- drives the same internal builders fcxml.c uses, so public readers are -->
	<!-- unchanged. M0 keys: dirs / cachedir / rescan / accept / reject. -->
	<!---->
	<!-- dirs: FSH font locations. FNX ships OS fonts in /System/Shared/Fonts, -->
	<!-- third parties in /Shared/Fonts; per-user fonts under ~/Shared/Fonts -->
	<!-- follow the FSH convention (see fsh-proposal.md). FNX dirs are absolute -->
	<!-- FSH paths — the stock XML's relative/xdg prefix machinery is not -->
	<!-- meaningful here (§4 conventions). -->
	<key>dirs</key>
	<array>
		<string>/System/Shared/Fonts</string>
		<string>/Shared/Fonts</string>
	</array>
	<!-- cachedir: DELIBERATELY UNUSABLE - a path under a non-directory, so -->
	<!-- fontconfig can never create or read a cache and scans the font dirs -->
	<!-- in-process instead. This is not tidiness, it is the fix for a real -->
	<!-- failure: the cache lives in the IMAGE, the test harness kills the VM at -->
	<!-- the end of every case, and a cache that was being written at that moment -->
	<!-- comes back torn. The next run then reads it and fontconfig hands -->
	<!-- FreeType a path it cannot open, so every text draw at that size fails -->
	<!-- ("face lookup(sans-serif) failed at 13px bold=0: ft-new-face (ft=2)", -->
	<!-- ft=2 being FT_Err_Unknown_File_Format) and the size's text never appears. -->
	<!-- It presented as a coin flip: clean after a fresh image, broken on a run -->
	<!-- that read what the previous killed run left behind. The font set is a -->
	<!-- handful of files, so a per-process scan is nearly free; a cache that can -->
	<!-- poison the next boot is not worth the microseconds. -->
	<key>cachedir</key>
	<string>/dev/null/fontconfig</string>
	<key>rescan</key>
	<integer>30</integer>
</dict>
</plist>
