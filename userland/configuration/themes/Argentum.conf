# Argentum.conf — the Argentum theme (the design language, plan §3).
#
# Theme = a .conf of colors, radii, bevel widths, gradient stops and
# font selection per theme, under /Shared/Themes/<theme>.conf. The
# active theme comes from the system.theme config domain (§3 / S1.3).
#
# Colour model (plan §3, decided): ONE accent in, coherent states out.
# The theme stores the accent + the base chrome/page/text colors, and
# the state colors (hover/armed/disabled/focused fills, outlines) are
# DERIVED by the theme engine's colour-derivation module (lighten/
# darken/saturate/alpha blends). A theme may override any derived
# color explicitly by adding a key under the widget's `derived`
# section — see the S1.3 comments in theme.cpp for the exact keys.
# This file ships the Argentum look (light silver-grey chrome,
# muted lavender/periwinkle accent, small radii, subtle bevels).
#
# Units: radii/bevels/font sizes are POINTS (1 pt = 1/72 in); drawing
# code multiplies by the session px/pt factor (S1.1). Colors are
# 0xRRGGBB.
#
# NOTE: this grammar allows full-line comments only — never put a
# comment after a value on the same line.

name = "Argentum"

# --- palette (base colors; state colors derive from accent) ---------
#
# accent: the design accent, muted lavender/periwinkle. Every state
# color (hover/armed fills, focus ring, the faint chrome outline) is
# derived from this one value by the theme engine (§3: one accent in,
# coherent states out). Theme may override any derived color.
accent = 0x8a7fc0

# chrome: the light silver-grey window/panel surface, as a subtle
# vertical gradient (top = lighter end, drawn top-down).
chrome = {
    top = 0xe8e8ec
    bottom = 0xd8d8de
}

# page: off-white document surface (behind content, inside frames).
page = 0xf7f7f2

# text: near-black, on chrome and on page.
text = 0x202024

# --- geometry (points) ----------------------------------------------
#
# Small corner radii (≈2–3 pt per §3); base is the common chrome
# radius (window frame, buttons), small for tiny controls.
radius = {
    small = 2
    base = 3
}

# 1 px bevel at the fallback factor, expressed in points.
bevel = 1

# fine 1px borders (points).
outline = 1

# --- font selection (UI chrome) --------------------------------------
font = {
    family = "DejaVu Sans"
    size = 13
}
