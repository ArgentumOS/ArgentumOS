# FNX account identity (domain: system.passwd).
#
# Machine state, not defaults: this is the authoritative account list
# and lives in /System/Configuration (nothing overrides it). One `user`
# record per account; shadow folding (plan Q2): the password hash lives
# in the record's `password` key, so there is no separate shadow file.
# `password = ""` = no password. Grammar: docs/config-design.md section
# 10 (+ group records, 10.1). Consumed by musl getpw* (M3) and the
# account tools (M4).
user = {
    admin = {
        uid = 0
        gid = 0
        gecos = "Admin"
        home = /Users/Admin
        shell = /System/Tools/sh
        password = ""
    }
}
