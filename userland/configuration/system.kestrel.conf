# system.kestrel.conf — the window manager's own settings (domain:
# system.kestrel; docs/design/workspace-plan.md §3.0, decision D6).
#
# The desktop is split by kind, not by app: the window manager owns the
# dock and the menubar, the Workspace app owns the wallpaper and the file
# manager. A config domain follows its owner, so the dock's keys live here
# — they were in system.workspace.conf until 2026-09, when the split moved
# them (system.workspace.conf keeps the app's own keys).
#
# Kestrel reads these through Application::configString(), with libconfig's
# system -> user -> shared precedence (docs/config-design.md §5): a
# user-scope copy overrides these defaults. Both values below are the
# documented defaults (initial-release.md §3.1), so a boot cannot tell the
# file from the code's fallback — CHANGING one is the only way to see that
# this file is the one being read.
#
# Not settings yet: dock.autohide and dock.magnify (§3.1) are animation
# behaviours, deferred until the dock has them.
dock = {
    position = "right"
    icon-size = 48
}

# The compositor (Composite redirection + the CM selection) is OFF: it is
# blocked on an Xfb memory fault, C1 of docs/design/kestrel-compositor-plan.md.
# A STRING, not a boolean — Application::configString() returns the fallback
# for a boolean value, so `compositor = true` would silently do nothing.
compositor = "false"
