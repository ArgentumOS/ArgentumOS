# boot mount table (system.mounts, System scope): init mounts each
# record in order after the root filesystem is up, replacing the old
# hardcoded try_mount calls (docs/system-config-files-plan.md M6, §5.5).
# The domain is dedicated to mount records, so each record sits at the
# top level (no 'mount' container wrapper - system.mounts.processes,
# not system.mounts.mount.processes).
#   fstype = filesystem type (mount -t <fstype>)
#   target = mount point (must exist in the root image)
#   source = optional mount source (defaults to the fstype); block
#            devices like /System/Devices/hdb need it (toybox mount
#            writes it automatically)
# Record order = mount order; a record missing fstype or target is
# skipped with a clear INIT error.
processes = {
    fstype = proc
    target = "/System/Processes"
}
pts = {
    fstype = devpts
    target = "/System/Devices/PTS/pts"
}
esp = {
    fstype = fat
    source = "/System/Devices/Disk/IDE/Disk0/Partition1"
    target = "/System/ESP"
}
