# FNX Xfb default settings (domain: system.config.xfb).
#
# Xfb takes its defaults from this file. It is an *overridable*
# first-party setting, so by convention it ships in
# /Shared/Configuration (docs/system-config-files-plan.md §5.0): a
# machine that wants different values writes the same domain into
# /System/Configuration, where system-first resolution wins; per-user
# overrides live in Users/<user>/Configuration/system.config.xfb.conf.
# Grammar: docs/config-design.md section 10.

# Server display number (the positional ":N").
display = "0"

# Disable X access control. The desktop is single-user and reachable only
# through its private unix socket; xfbdesk-init historically passed -ac.
ac = true

# Do not listen on TCP - local unix socket only.
nolisten = "tcp"

# Not set on purpose:
#   screen - geometry is auto-detected from /dev/fb0. Set "WxHxD" here
#            only to force a size different from the framebuffer.
