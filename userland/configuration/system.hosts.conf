<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
	<!-- name resolution (system.hosts, System scope): musl's hosts -->
	<!-- backend (lookup_name.c name_from_hosts) serves getaddrinfo / -->
	<!-- gethostbyname from this domain instead of a legacy hosts file -->
	<!-- (docs/system-config-files-plan.md M5). The domain is dedicated to -->
	<!-- host records, so each record sits at the top level (no 'hosts' -->
	<!-- container wrapper - system.hosts.localhost, not -->
	<!-- system.hosts.hosts.localhost). Each record is one host: -->
	<!-- addresses = comma list of IPs (v4 or v6) -->
	<!-- aliases   = extra names resolving to the same addresses -->
	<key>localhost</key>
	<dict>
		<key>addresses</key>
		<array>
			<string>127.0.0.1</string>
			<string>::1</string>
		</array>
		<key>aliases</key>
		<string></string>
	</dict>
</dict>
</plist>
