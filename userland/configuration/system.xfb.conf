<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
	<!-- FNX Xfb default settings (domain: system.xfb). -->
	<!---->
	<!-- Xfb takes its defaults from this file. It is an *overridable* -->
	<!-- first-party setting, so by convention it ships in -->
	<!-- /Shared/Configuration (docs/system-config-files-plan.md §5.0): a -->
	<!-- machine that wants different values writes the same domain into -->
	<!-- /System/Configuration, where system-first resolution wins; per-user -->
	<!-- overrides live in Users/<user>/Configuration/system.xfb.conf. -->
	<!-- Grammar: docs/config-design.md section 10. -->
	<!-- Server display number (the positional ":N"). -->
	<key>display</key>
	<string>0</string>
	<!-- Disable X access control. The desktop is single-user and reachable only -->
	<!-- through its private unix socket; xfbdesk-init historically passed -ac. -->
	<key>ac</key>
	<true/>
	<!-- Do NOT reset the server when its last client disconnects. Without this, X -->
	<!-- does what it has always done: the last client to go away resets the server, -->
	<!-- and the reset re-initializes every extension and re-opens the input devices. -->
	<!-- On this machine that costs ~2.2 seconds - during which the screen keeps its -->
	<!-- last frame (cursor included), the pointer does not move because nothing is -->
	<!-- reading the mouse, and the kernel's input queue overflows behind it - which -->
	<!-- is exactly the reported "the X server freezes for a few seconds after I exit -->
	<!-- the widget zoo". The session has no window manager to restart, so the reset -->
	<!-- buys nothing. -->
	<key>reset</key>
	<false/>
	<!-- Do not listen on TCP - local unix socket only. -->
	<key>nolisten</key>
	<string>tcp</string>
	<!-- Not set on purpose: -->
	<!-- screen - geometry is auto-detected from /dev/fb0. Set "WxHxD" here -->
	<!-- only to force a size different from the framebuffer. -->
</dict>
</plist>
