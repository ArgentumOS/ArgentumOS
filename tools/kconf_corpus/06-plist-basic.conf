<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<!--
    A plist kernel.conf: the same settings as 01-basic.conf and 03-bool-int.conf
    in the spelling every other FNX configuration uses. The kernel reads it with
    its own freestanding arm (kernel/kconf.c, P3e).
-->
<dict>
	<!-- where kernel messages go -->
	<key>console</key>
	<string>ttyS0</string>
	<key>root</key>
	<string>/dev/hda1</string>
	<key>verbose</key>
	<true/>
	<key>ro</key>
	<false/>
	<key>ramdisksize</key>
	<integer>4096</integer>
	<!-- an empty string: the plist spelling of `emptykey =` -->
	<key>emptykey</key>
	<string></string>
</dict>
</plist>
