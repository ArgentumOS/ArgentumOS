<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
	<!-- FNX kernel boot options (kernel.conf) — read from the ESP by the EFI stub -->
	<!-- before ExitBootServices and applied after the compiled-in cmdline -->
	<!-- defaults (docs/design/kernel-conf-plan.md, docs/design/config-design.md -->
	<!-- §12). -->
	<!---->
	<!-- This file lives next to BOOTX64.EFI on the ESP; the config tool edits it -->
	<!-- through the system.kernel domain when the ESP is mounted. It is an XML -->
	<!-- plist, the spelling every FNX configuration uses, read by the kernel's -->
	<!-- own freestanding subset parser (kernel/kconf.c): a setting is a <key> -->
	<!-- with one <string>, <integer>, <true/> or <false/> value, and the kernel -->
	<!-- keeps the settings it knows — an unknown key is ignored with a warning, -->
	<!-- as is a value the subset cannot use (a <dict>, an <array>, a <real>): -->
	<!-- skipped, never a halt. -->
	<!---->
	<!-- The dict below is EMPTY: an unmodified image boots exactly like a machine -->
	<!-- without this file. To override an option, add its key and value to the -->
	<!-- dict; values are validated against the same lists as the kernel cmdline — -->
	<!-- an invalid value prints a warning at boot and the compiled-in default is -->
	<!-- kept. -->
	<!---->
	<!-- Where kernel messages go (the system console). The compiled-in default -->
	<!-- is the first serial port. -->
	<!-- <key>console</key> -->
	<!-- <string>/System/Devices/Serial/Port0</string> -->
	<!---->
	<!-- The root filesystem device. Default: the whole AHCI disk (the root -->
	<!-- filesystem type is probed: minix -> ext2 -> iso9660 -> xbfs). -->
	<!-- <key>root</key> -->
	<!-- <string>/System/Devices/Disk/AHCI/Disk0/WholeDisk</string> -->
	<!---->
	<!-- Boot the static recovery shell instead of the normal userland. -->
	<!-- <key>recovery</key> -->
	<!-- <true/> -->
	<!---->
	<!-- Mount the root read-only. -->
	<!-- <key>ro</key> -->
	<!-- <true/> -->
	<!---->
	<!-- Other kernel parameters (docs/reference/kernel-parameters.txt) work the -->
	<!-- same way: rootfstype, ramdisksize, initrd, ... Unknown keys are ignored -->
	<!-- with a warning. -->
</dict>
</plist>
