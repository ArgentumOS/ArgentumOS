# FNX kernel boot options (kernel.conf) — read from the ESP by the EFI
# stub before ExitBootServices and applied after the compiled-in cmdline
# defaults (docs/design/kernel-conf-plan.md, docs/design/config-design.md
# §12).
#
# This file lives next to BOOTX64.EFI on the ESP; the config tool edits it
# through the system.kernel domain when the ESP is mounted. Grammar: the
# same .conf format every FNX configuration uses — '#' comments, flat
# dot-nested keys, bare or "quoted" strings, true/false, integers.
#
# Everything below is commented out: an unmodified image boots exactly
# like a machine without this file. Uncomment a line (and edit the value)
# to override that option for THIS kernel; values are validated against
# the same lists as the kernel cmdline — an invalid value prints a warning
# at boot and the compiled-in default is kept.

# Where kernel messages go (the system console). The compiled-in default
# is the first serial port.
#console = "/System/Devices/Serial/Port0"

# The root filesystem device. Default: the whole AHCI disk (the root
# filesystem type is probed: minix -> ext2 -> iso9660 -> xbfs).
#root = "/System/Devices/Disk/AHCI/Disk0/WholeDisk"

# Boot the static recovery shell instead of the normal userland.
#recovery = true

# Mount the root read-only.
#ro = true

# Other kernel parameters (docs/reference/kernel-parameters.txt) work the
# same way: rootfstype, ramdisksize, initrd, ... Unknown keys are ignored
# with a warning.
